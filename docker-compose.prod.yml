version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appdaf-app-prod
    ports:
      - "80:80"
    environment:
      # Configuration pour Railway PostgreSQL en production
      - DB_DRIVER=pgsql
      - DB_HOST=interchange.proxy.rlwy.net
      - DB_PORT=47627
      - DB_NAME=railway
      - DB_USER=postgres
      - DB_PASS=FMFHHhXlvIingoYbqOvLGpRBmTtWBZxg
      - DB_CHARSET=utf8mb4
    restart: unless-stopped
    networks:
      - appdaf-network
    # Pas de volume monté en production pour la sécurité

networks:
  appdaf-network:
    driver: bridge
